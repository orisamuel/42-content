<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{HEAD_EXTRA}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ROOT}}assets/css/style.css">
<link rel="icon" href="{{ROOT}}assets/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="{{ROOT}}assets/brand/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ROOT}}assets/brand/apple-touch-icon.png">
{{TRACKING_HEAD}}
</head>
<body>
{{BODY_EXTRA}}
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ROOT}}index.html" aria-label="{{SITE_TITLE}} - דף הבית">
      {{LOGO}}
    </a>
    <button class="nav-toggle" aria-label="תפריט" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" aria-label="ניווט ראשי">
      {{NAV}}

  </div>
</header>

<main>
{{CONTENT}}
</main>

  <div class="container footer-inner">
    <div class="footer-brand">
      {{FOOTER_LOGO}}
      <p>{{TAGLINE}}</p>
    </div>
    <nav class="footer-nav" aria-label="קישורים">
      <a href="{{ROOT}}pages/about.html">אודות</a>
      <a href="{{ROOT}}pages/privacy.html">מדיניות פרטיות</a>

<script>window.SITE={{SITE_CONFIG}};</script>
<script src="{{ROOT}}assets/js/site.js" defer></script>
