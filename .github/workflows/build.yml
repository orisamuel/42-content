name: בניית האתר ופרסום

on:
  push:
    branches: [main]
    paths:
      - 'data/articles.json'
      - 'data/site.json'
      - 'templates/**'
      - 'content/**'
      - 'assets/**'
      - 'scripts/**'
      - 'admin/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: בניית האתר
        run: node scripts/build.mjs

      - name: קומיט של הדפים שנוצרו
        run: |
          git config user.name "42-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים"
          else
            git commit -m "בנייה מחדש של דפי האתר [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: פריסה ל-GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
