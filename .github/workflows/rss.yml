name: עדכון RSS ובנייה

on:
  schedule:
    - cron: '0 */3 * * *'   # כל 3 שעות
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: משיכת פידים וניסוח מחדש
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REWRITE_MODEL: ${{ vars.REWRITE_MODEL }}
        run: node scripts/fetch-rss.mjs

      - name: בניית האתר
        run: node scripts/build.mjs

      - name: קומיט ופרסום
        run: |
          git config user.name "42-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים"
          else
            git commit -m "עדכון תוכן אוטומטי מ-RSS [skip ci]"
            git push
          fi
