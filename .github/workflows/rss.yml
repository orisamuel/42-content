name: עדכון RSS ובנייה

on:
  schedule:
    - cron: '0 4 * * 0-4'   # פעם ביום ב-04:00 UTC (07:00 שעון ישראל), ראשון עד חמישי
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: משיכת פידים וניסוח מחדש
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REWRITE_MODEL: ${{ vars.REWRITE_MODEL }}
        run: node scripts/fetch-rss.mjs

      - name: בניית האתר
        run: node scripts/build.mjs

      - name: קומיט של התוכן החדש
        run: |
          git config user.name "42-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים"
          else
            git commit -m "עדכון תוכן אוטומטי מ-RSS [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: פריסה ל-GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # עד 30 דקות - התור של Pages איטי לפעמים
          error_count: 15
